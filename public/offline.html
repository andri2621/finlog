<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Koneksi Belum Tersedia • FinLog</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0A0F1D;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .bg-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(10, 15, 29, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 380px;
      width: 100%;
      background: #0F162A;
      border: 1px solid #1E293B;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
    }
    .logo span {
      color: #10B981;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F59E0B;
      margin-bottom: 20px;
      position: relative;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
    }
    .pulse-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 12px;
      height: 12px;
      background: #F59E0B;
      border-radius: 50%;
      border: 2px solid #0F162A;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #FFFFFF;
      line-height: 1.3;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .info-card {
      width: 100%;
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 12px;
      color: #6EE7B7;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }
    .info-card svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .btn-retry {
      width: 100%;
      padding: 14px;
      background: #10B981;
      color: #0A0F1D;
      border: none;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      background: #34D399;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .status-text {
      margin-top: 14px;
      font-size: 11px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="logo">
      Fin<span>Log</span>
    </div>

    <div class="icon-wrapper">
      <span class="pulse-dot"></span>
      <!-- Wifi Off Icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Koneksi Belum Tersedia</h1>
    <p>Aplikasi belum memiliki cache offline karena belum pernah dibuka saat online di perangkat ini.</p>

    <div class="info-card">
      <!-- Info Icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <div>
        <strong>Perlu Online Sekali Saja:</strong> Hubungkan internet untuk login dan mengunduh data awal. Setelah itu, FinLog dapat digunakan 100% tanpa internet.
      </div>
    </div>

    <button class="btn-retry" onclick="handleRetry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Coba Hubungkan Kembali</span>
    </button>

    <div class="status-text" id="status-label">
      Menunggu jaringan internet...
    </div>
  </div>

  <script>
    function handleRetry() {
      const label = document.getElementById('status-label');
      label.textContent = 'Memeriksa koneksi...';
      label.style.color = '#10B981';
      setTimeout(() => {
        window.location.reload();
      }, 500);
    }

    // Auto reload as soon as internet connection is detected
    window.addEventListener('online', () => {
      const label = document.getElementById('status-label');
      label.textContent = 'Koneksi terhubung! Memuat aplikasi...';
      label.style.color = '#10B981';
      setTimeout(() => {
        window.location.reload();
      }, 600);
    });
  </script>
</body>
</html>
